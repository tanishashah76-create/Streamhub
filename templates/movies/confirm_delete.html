{% extends 'base.html' %}

{% block title %}Delete Movie - StreamHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="glass-panel p-4 p-md-5 text-white text-center">
                <i class="bi bi-exclamation-triangle text-warning display-3 mb-3"></i>
                <h2 class="fw-bold mb-3">Delete from SQLite?</h2>
                <p class="text-secondary mb-4">
                    Are you sure you want to permanently delete <strong>"{{ movie.title }}"</strong> from the SQLite database? This action cannot be undone.
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <button type="submit" class="btn btn-danger px-4 py-2">
                            <i class="bi bi-trash-fill me-1"></i> Yes, Delete
                        </button>
                        <a href="{% url 'movie_detail' movie.id %}" class="btn btn-outline-light px-4 py-2">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
